<div class="p-6 max-w-3xl mx-auto space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Portada — Noticias</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Configura hero y categorías de la página de noticias</p>
    </div>
    <button (click)="guardar()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition">Guardar</button>
  </div>

  <div *ngIf="guardado" class="bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-700 rounded-lg px-4 py-3 text-green-800 dark:text-green-300 text-sm">✓ Guardado</div>

  <div *ngIf="config" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
    <h2 class="font-semibold text-slate-800 dark:text-white">Hero</h2>
    <div>
      <label class="block text-xs text-slate-500 mb-1">Título</label>
      <input [(ngModel)]="config.heroTitulo" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <div>
      <label class="block text-xs text-slate-500 mb-1">Descripción</label>
      <textarea [(ngModel)]="config.heroDescripcion" rows="2" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
    </div>
    <div>
      <app-image-url-input label="Imagen de fondo" [(ngModel)]="config.heroImagenFondo" placeholder="https://..." previewHeight="h-40" />
    </div>
    <hr class="border-slate-200 dark:border-slate-700" />
    <h2 class="font-semibold text-slate-800 dark:text-white">Secciones</h2>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs text-slate-500 mb-1">Título destacadas</label>
        <input [(ngModel)]="config.destacadasTitulo" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-xs text-slate-500 mb-1">Título listado</label>
        <input [(ngModel)]="config.listadoTitulo" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </div>
    <hr class="border-slate-200 dark:border-slate-700" />
    <h2 class="font-semibold text-slate-800 dark:text-white">Categorías</h2>
    <div class="flex flex-wrap gap-2">
      <span *ngFor="let c of config.categorias" class="flex items-center gap-1 px-3 py-1 bg-blue-50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300 rounded-full text-xs font-medium">
        {{ c }}<button (click)="quitarCategoria(c)" class="hover:text-red-500 transition">×</button>
      </span>
    </div>
    <div class="flex gap-2">
      <input [(ngModel)]="nuevaCategoria" placeholder="Nueva categoría..." (keydown.enter)="agregarCategoria()"
             class="flex-1 border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button (click)="agregarCategoria()" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition">Añadir</button>
    </div>
  </div>
</div>
