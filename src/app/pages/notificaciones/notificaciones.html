<div class="p-6 max-w-4xl mx-auto space-y-6">

  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Notificaciones</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">{{ noLeidas }} sin leer · {{ lista.length }} total</p>
    </div>
    <div class="flex gap-2">
      <button *ngIf="noLeidas > 0" (click)="marcarTodasLeidas()"
              class="text-sm px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
        Marcar todas leídas
      </button>
      <button *ngIf="esAdmin" (click)="mostrarForm = !mostrarForm"
              class="text-sm px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold transition">
        + Nueva
      </button>
    </div>
  </div>

  <div *ngIf="guardado" class="bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-700 rounded-lg px-4 py-3 text-green-800 dark:text-green-300 text-sm">
    ✓ Notificación creada correctamente
  </div>

  <div *ngIf="mostrarForm && esAdmin" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5 space-y-4">
    <h2 class="font-semibold text-slate-800 dark:text-white">Nueva notificación</h2>
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Título *</label>
      <input [(ngModel)]="nueva.titulo" placeholder="Título"
             class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Descripción</label>
      <textarea [(ngModel)]="nueva.descripcion" rows="2" placeholder="Descripción opcional"
                class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Usuario (vacío = global)</label>
      <input [(ngModel)]="nueva.usuario" placeholder="ID de usuario (opcional)"
             class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <div class="flex gap-2">
      <button (click)="guardar()" [disabled]="!nueva.titulo.trim()"
              class="px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 text-white rounded-lg text-sm font-semibold transition">Crear</button>
      <button (click)="mostrarForm = false"
              class="px-4 py-2 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-lg text-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition">Cancelar</button>
    </div>
  </div>

  <div *ngIf="cargando" class="text-center py-16 text-slate-400">Cargando...</div>
  <div *ngIf="!cargando && lista.length === 0" class="text-center py-16 text-slate-400">No hay notificaciones.</div>

  <div *ngIf="!cargando" class="space-y-2">
    <div *ngFor="let n of lista"
         class="bg-white dark:bg-slate-800 border rounded-xl p-4 flex items-start gap-4"
         [class.border-blue-200]="!n.leido" [class.dark:border-blue-700]="!n.leido"
         [class.border-slate-200]="n.leido"  [class.dark:border-slate-700]="n.leido">
      <div class="mt-1.5 w-2.5 h-2.5 rounded-full shrink-0"
           [class.bg-blue-500]="!n.leido" [class.bg-slate-300]="n.leido"></div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-slate-900 dark:text-white">{{ n.titulo }}</p>
        <p *ngIf="n.descripcion" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{ n.descripcion }}</p>
        <p class="text-xs text-slate-400 mt-1">{{ n.usuario ? ('Para: ' + n.usuario) : 'Global' }} · {{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</p>
      </div>
      <div class="flex gap-2 shrink-0">
        <button *ngIf="!n.leido" (click)="marcarLeida(n)"
                class="inline-flex items-center gap-1 text-xs px-2 py-1 rounded border border-slate-200 dark:border-slate-600 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          Leída
        </button>
        <button (click)="eliminar(n)"
                class="inline-flex items-center gap-1 text-xs px-2 py-1 rounded border border-red-200 dark:border-red-800 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          Eliminar
        </button>
      </div>
    </div>
  </div>

</div>
