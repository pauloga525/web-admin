<div class="p-6 max-w-7xl mx-auto space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Gestión de Estudiantes</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">{{ lista.length }} estudiantes registrados</p>
    </div>
    <button (click)="nuevo()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition">
      + Nuevo
    </button>
  </div>

  <div *ngIf="guardado" class="bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-700 rounded-lg px-4 py-3 text-green-800 dark:text-green-300 text-sm">✓ Guardado correctamente</div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-4">
      <div class="flex gap-3">
        <input [(ngModel)]="busqueda" placeholder="Buscar por nombre, cédula o especialidad..."
               class="flex-1 border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <select [(ngModel)]="filtroEstado"
                class="border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">Todos</option>
          <option *ngFor="let e of estados" [value]="e">{{ e | titlecase }}</option>
        </select>
      </div>

      <div *ngIf="cargando" class="text-center py-12 text-slate-400">Cargando...</div>
      <div *ngIf="!cargando && listaFiltrada.length === 0" class="text-center py-12 text-slate-400">Sin resultados.</div>

      <div *ngIf="!cargando" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 dark:bg-slate-700">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Estudiante</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Especialidad</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Estado</th>
              <th class="px-4 py-3"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
            <tr *ngFor="let e of listaFiltrada"
                class="hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer transition"
                [class.bg-blue-50]="seleccionado?._id === e._id" (click)="seleccionar(e)">
              <td class="px-4 py-3">
                <p class="font-medium text-slate-900 dark:text-white">{{ e.nombre }} {{ e.apellido }}</p>
                <p class="text-xs text-slate-400">{{ e.cedula }}</p>
              </td>
              <td class="px-4 py-3 text-slate-600 dark:text-slate-300">{{ e.especialidad || '—' }}</td>
              <td class="px-4 py-3">
                <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                      [class.bg-green-100]="e.estado==='activo'"   [class.text-green-700]="e.estado==='activo'"
                      [class.bg-red-100]="e.estado==='inactivo'"   [class.text-red-700]="e.estado==='inactivo'"
                      [class.bg-slate-100]="e.estado==='egresado'" [class.text-slate-600]="e.estado==='egresado'">
                  {{ e.estado | titlecase }}
                </span>
              </td>
              <td class="px-4 py-3 text-right">
                <button (click)="$event.stopPropagation(); eliminar(e)" class="inline-flex items-center gap-1 text-red-500 hover:text-red-700 text-xs transition">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                  Eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div *ngIf="seleccionado || esNuevo" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5 space-y-3 self-start sticky top-6">
      <div class="flex items-center justify-between mb-1">
        <h2 class="font-semibold text-slate-800 dark:text-white">{{ esNuevo ? 'Nuevo' : 'Editar' }}</h2>
        <button (click)="cerrar()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-500 mb-1">Nombre *</label>
          <input [(ngModel)]="form.nombre" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Apellido</label>
          <input [(ngModel)]="form.apellido" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>
      <div>
        <label class="block text-xs text-slate-500 mb-1">Cédula *</label>
        <input [(ngModel)]="form.cedula" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-500 mb-1">Email</label>
          <input [(ngModel)]="form.email" type="email" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Teléfono</label>
          <input [(ngModel)]="form.telefono" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>
      <div>
        <label class="block text-xs text-slate-500 mb-1">Especialidad</label>
        <input [(ngModel)]="form.especialidad" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-500 mb-1">Curso</label>
          <input [(ngModel)]="form.curso" placeholder="3A" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">Año lectivo</label>
          <input [(ngModel)]="form.anioLectivo" placeholder="2024-2025" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>
      <div>
        <label class="block text-xs text-slate-500 mb-1">Estado</label>
        <select [(ngModel)]="form.estado" class="w-full border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option *ngFor="let e of estados" [value]="e">{{ e | titlecase }}</option>
        </select>
      </div>
      <div class="flex gap-2 pt-1">
        <button (click)="guardar()" [disabled]="!form.nombre || !form.cedula"
                class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 text-white rounded-lg text-sm font-semibold transition">Guardar</button>
        <button (click)="cerrar()" class="px-3 py-2 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-lg text-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition">×</button>
      </div>
    </div>
  </div>
</div>
