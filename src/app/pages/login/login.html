<div class="min-h-screen bg-background-light dark:bg-background-dark flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Fondo decorativo — círculos difusos -->
  <div class="absolute inset-0 pointer-events-none select-none" aria-hidden="true">
    <div class="absolute -top-32 -left-32 w-[480px] h-[480px] rounded-full bg-primary/10 blur-3xl"></div>
    <div class="absolute -bottom-40 -right-24 w-[520px] h-[520px] rounded-full bg-primary/8 blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] rounded-full bg-primary/5 blur-2xl"></div>
  </div>

  <!-- Puntos de cuadrícula decorativos -->
  <div class="absolute inset-0 pointer-events-none select-none opacity-[0.03] dark:opacity-[0.06]"
       style="background-image: radial-gradient(circle, #1b1be4 1px, transparent 1px); background-size: 32px 32px;"
       aria-hidden="true"></div>

  <!-- CARD -->
  <div class="login-card relative w-full max-w-md">

    <!-- Logo / marca -->
    <div class="flex flex-col items-center mb-8">
      <div class="relative mb-4">
        <div class="pulse-ring absolute inset-0 rounded-full bg-primary/20"></div>
        <!-- Logo Don Bosco — mix-blend-mode:screen elimina el fondo negro -->
        <div class="relative w-24 h-24 rounded-full bg-white flex items-center justify-center shadow-lg shadow-primary/30 overflow-hidden">
          <img src="logo.png" alt="Logo UETS"
               class="w-full h-full object-contain"
               style="mix-blend-mode: screen;" />
        </div>
      </div>
      <h1 class="text-xl font-bold text-slate-800 dark:text-white tracking-tight">Panel Administrativo</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Unidad Educativa Técnico Salesiano</p>
    </div>

    <!-- Formulario -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xl shadow-slate-200/60 dark:shadow-black/40 p-8">

      <h2 class="text-base font-semibold text-slate-700 dark:text-slate-200 mb-6">Iniciar sesión</h2>

      <form (ngSubmit)="submit()" #f="ngForm" class="space-y-5" novalidate>

        <!-- Usuario -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Usuario</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M20 21c0-3-4-5-8-5s-8 2-8 5"/>
              </svg>
            </span>
            <input
              type="text"
              [(ngModel)]="usuario"
              name="usuario"
              placeholder="Ingresa tu usuario"
              autocomplete="username"
              [class]="error
                ? 'w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-red-400 dark:border-red-500 bg-red-50 dark:bg-red-950/20 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-red-400/40 transition'
                : 'w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary/50 transition'"
            />
          </div>
        </div>

        <!-- Contraseña -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Contraseña</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              [type]="mostrarPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              [class]="error
                ? 'w-full pl-10 pr-10 py-2.5 text-sm rounded-xl border border-red-400 dark:border-red-500 bg-red-50 dark:bg-red-950/20 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-red-400/40 transition'
                : 'w-full pl-10 pr-10 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary/50 transition'"
            />
            <!-- Toggle ver contraseña -->
            <button type="button" (click)="mostrarPassword = !mostrarPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition">
              @if (mostrarPassword) {
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              } @else {
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Sesión expirada -->
        @if (sesionExpirada) {
          <div class="flex items-center gap-2 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 rounded-xl px-4 py-3 animate-[fadeIn_.2s_ease_forwards]">
            <svg class="w-4 h-4 text-amber-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <p class="text-xs text-amber-700 dark:text-amber-300 font-medium">Tu sesión expiró por inactividad. Inicia sesión nuevamente.</p>
          </div>
        }

        <!-- Error -->
        @if (error) {
          <div class="flex items-center gap-2 bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-800 rounded-xl px-4 py-3 animate-[fadeIn_.2s_ease_forwards]">
            <svg class="w-4 h-4 text-red-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <p class="text-xs text-red-600 dark:text-red-400 font-medium">Usuario o contraseña incorrectos.</p>
          </div>
        }

        <!-- Botón submit -->
        <button type="submit"
          [disabled]="cargando || !usuario || !password"
          class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-sm font-semibold bg-primary text-white hover:bg-primary/90 active:scale-[.98] transition disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-primary/25 mt-2">
          @if (cargando) {
            <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
            Verificando...
          } @else {
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Ingresar
          }
        </button>

      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-[11px] text-slate-400 dark:text-slate-600 mt-6">
      © {{currentYear}} Unidad Educativa Técnica Salesiana — Panel Admin
    </p>

  </div>
</div>
